<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/reset-password/css/reset-password-form.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h2>Reset Password</h2>
        <form id="reset-password-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="current-password">Current password:</label>
                <input type="password" id="current-password" name="currentPassword" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="new-password">New password:</label>
                <input type="password" id="new-password" name="newPassword" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="repeat-new-password">Repeat new password:</label>
                <input type="password" id="repeat-new-password" name="repeatNewPassword" minlength="6" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <hr>
        <div class="oauth-buttons">
            <button id="login" data-url="/login">Back to Log in</button>
        </div>
    </div>
    <script src="/reset-password/js/reset-password.js"></script>
</body>
</html>
