<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/register/css/register-form.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h2>Register</h2>
        <form id="register-form" action="/auth/register" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="repeat-pass">Repeat password:</label>
                <input type="password" id="repeat-pass" name="repeatPass" minlength="6" required>
            </div>
            <button type="submit">Sign up</button>
        </form>
        <hr>
        <div class="oauth-buttons">
            <button id="login" data-url="/login">Log in</button>
        </div>
    </div>
    <script src="/register/js/register.js"></script>
</body>
</html>
